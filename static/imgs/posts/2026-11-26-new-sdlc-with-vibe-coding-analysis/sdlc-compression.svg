<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">AI 对 SDLC 各阶段的压缩程度（解读者定性评估）</text>
<text x="30" y="92" font-size="15" font-weight="bold" fill="#1e293b">需求与规划</text><rect x="150" y="76" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="76" width="150.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="93" font-size="13" fill="#4f46e5">人机对话</text><text x="540" y="93" font-size="13" fill="#475569">AI 参与细化：用户故事、边界、原型</text><text x="30" y="144" font-size="15" font-weight="bold" fill="#1e293b">设计与架构</text><rect x="150" y="128" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="128" width="45.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="145" font-size="13" fill="#4f46e5">人类主导</text><text x="540" y="145" font-size="13" fill="#475569">最“顽固”的人类阶段：权衡取舍</text><text x="30" y="196" font-size="15" font-weight="bold" fill="#1e293b">实现</text><rect x="150" y="180" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="180" width="270.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="197" font-size="13" fill="#4f46e5">AI 主导</text><text x="540" y="197" font-size="13" fill="#475569">周→小时；写代码变为审代码</text><text x="30" y="248" font-size="15" font-weight="bold" fill="#1e293b">测试与QA</text><rect x="150" y="232" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="232" width="180.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="249" font-size="13" fill="#4f46e5">人机共建</text><text x="540" y="249" font-size="13" fill="#475569">输出评估 + 轨迹评估；质量飞轮</text><text x="30" y="300" font-size="15" font-weight="bold" fill="#1e293b">评审与部署</text><rect x="150" y="284" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="284" width="165.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="301" font-size="13" fill="#4f46e5">AI 辅助</text><text x="540" y="301" font-size="13" fill="#475569">AI 首轮评审；AI 感知的发布</text><text x="30" y="352" font-size="15" font-weight="bold" fill="#1e293b">维护与演进</text><rect x="150" y="336" width="300" height="24" rx="4" fill="#e2e8f0"/><rect x="150" y="336" width="210.0" height="24" rx="4" fill="#6366f1"/><text x="460" y="353" font-size="13" fill="#4f46e5">AI 赋能</text><text x="540" y="353" font-size="13" fill="#475569">遗留代码可被理解与安全重构</text>
<text x="450" y="390" text-anchor="middle" font-size="12" fill="#64748b">条形长度 = AI 可接管/加速的程度（定性），依据原文对各阶段的描述归纳</text>
</svg>